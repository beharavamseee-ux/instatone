<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | InstaTone</title>

    <meta name="description"
          content="The page you're looking for could not be found on InstaTone.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b12;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 620px;
            text-align: center;
            padding: 50px 30px;
            border: 1px solid #24243a;
            border-radius: 22px;
            background: #12121c;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 35px;
        }

        .number {
            font-size: 100px;
            line-height: 1;
            font-weight: 900;
            margin: 0;
        }

        h1 {
            font-size: 28px;
            margin: 20px 0 12px;
        }

        p {
            color: #a9a9bb;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 13px 24px;
            border-radius: 12px;
            background: #ffffff;
            color: #111111;
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .links {
            margin-top: 25px;
            font-size: 14px;
        }

        .links a {
            color: #aaaabd;
            text-decoration: none;
            margin: 0 8px;
        }

        .links a:hover {
            color: #ffffff;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        InstaTone
    </div>

    <div class="number">
        404
    </div>

    <h1>Page Not Found</h1>

    <p>
        The page you're looking for doesn't exist or may have been moved.
        You can return to InstaTone and create your ringtone.
    </p>

    <a href="/" class="button">
        ← Back to Ringtone Maker
    </a>

    <div class="links">
        <a href="/faq">FAQ</a>
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
        <a href="/contact">Contact</a>
    </div>

</div>

</body>
</html>
